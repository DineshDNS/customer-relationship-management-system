- name: Apply Namespace
  command: kubectl apply -f ../k8s/namespace.yaml

- name: Apply ConfigMap
  command: kubectl apply -f ../k8s/crm-config.yaml

- name: Apply Secret
  command: kubectl apply -f ../k8s/secret.yaml

- name: Deploy PostgreSQL
  command: kubectl apply -f ../k8s/postgres-deployment.yaml

- name: PostgreSQL Service
  command: kubectl apply -f ../k8s/postgres-service.yaml

- name: Deploy Backend
  command: kubectl apply -f ../k8s/backend-deployment.yaml

- name: Backend Service
  command: kubectl apply -f ../k8s/backend-service.yaml

- name: Deploy Frontend
  command: kubectl apply -f ../k8s/frontend-deployment.yaml

- name: Frontend Service
  command: kubectl apply -f ../k8s/frontend-service.yaml

  - name: Restart Backend
  command: kubectl rollout restart deployment/backend -n crm

- name: Restart Frontend
  command: kubectl rollout restart deployment/frontend -n crm

- name: Wait for Backend Rollout
  command: kubectl rollout status deployment/backend -n crm --timeout=300s

- name: Wait for Frontend Rollout
  command: kubectl rollout status deployment/frontend -n crm --timeout=300s

- name: Wait for Backend Pod
  command: kubectl wait --for=condition=Ready pod -l app=backend -n crm --timeout=300s

- name: Run Django Migrations
  shell: |
    POD=$(kubectl get pods -n crm -l app=backend -o jsonpath="{.items[0].metadata.name}")
    kubectl exec -n crm $POD -- python manage.py migrate
  args:
    executable: /bin/bash

- name: Verify Pods
  command: kubectl get pods -n crm

- name: Verify Services
  command: kubectl get svc -n crm

- name: Verify Deployments
  command: kubectl get deployment -n crm