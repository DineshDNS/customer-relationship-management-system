version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: crm_postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: crm_db

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: 667254

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

  backend:

    build:

      context: ./Backend

    container_name: crm_backend

    restart: unless-stopped

    env_file:

      - ./Backend/.env.docker

    command: gunicorn crm.wsgi:application --bind 0.0.0.0:8000

    ports:

      - "8000:8000"

    depends_on:

      postgres:

        condition: service_healthy

    volumes:

      - ./Backend:/app

  frontend:

    build:

      context: ./Frontend

    container_name: crm_frontend

    restart: unless-stopped

    depends_on:

      - backend

    ports:

      - "5173:80"

volumes:

  postgres_data: