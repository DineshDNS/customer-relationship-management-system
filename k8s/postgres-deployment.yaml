apiVersion: apps/v1

kind: Deployment

metadata:
  name: postgres
  namespace: crm

spec:

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:

      labels:
        app: postgres

    spec:

      containers:

      - name: postgres

        image: postgres:16

        imagePullPolicy: IfNotPresent

        ports:

        - containerPort: 5432

        env:

        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: crm-config
              key: DB_NAME

        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: crm-config
              key: DB_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secret
              key: DB_PASSWORD

        volumeMounts:

        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

        readinessProbe:

          exec:

            command:

            - pg_isready

            - -U

            - postgres

          initialDelaySeconds: 10

          periodSeconds: 10

        livenessProbe:

          exec:

            command:

            - pg_isready

            - -U

            - postgres

          initialDelaySeconds: 30

          periodSeconds: 20

        resources:

          requests:

            cpu: "250m"

            memory: "256Mi"

          limits:

            cpu: "500m"

            memory: "512Mi"

      volumes:

      - name: postgres-storage

        persistentVolumeClaim:

          claimName: postgres-pvc