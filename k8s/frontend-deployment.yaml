apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend
  namespace: crm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: dinesh3715/crm-frontend:12

        imagePullPolicy: Always

        ports:

        - containerPort: 80

        resources:

          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "250m"