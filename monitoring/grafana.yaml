apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:

    metadata:
      labels:
        app: grafana

    spec:

      containers:

      - name: grafana

        image: grafana/grafana:latest

        imagePullPolicy: IfNotPresent

        ports:

        - containerPort: 3000

        env:

        - name: GF_SECURITY_ADMIN_USER
          value: admin

        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin123

        resources:

          requests:
            cpu: "100m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        volumeMounts:

        - name: grafana-storage
          mountPath: /var/lib/grafana

      volumes:

      - name: grafana-storage

        persistentVolumeClaim:
          claimName: grafana-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: grafana
  namespace: monitoring

spec:

  type: ClusterIP

  selector:
    app: grafana

  ports:

  - port: 3000

    targetPort: 3000