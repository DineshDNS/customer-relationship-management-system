apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:
      labels:
        app: prometheus

    spec:

      containers:

      - name: prometheus

        image: prom/prometheus:latest

        imagePullPolicy: IfNotPresent

        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"

        ports:

        - containerPort: 9090

        volumeMounts:

        - name: prometheus-config

          mountPath: /etc/prometheus

        - name: prometheus-storage

          mountPath: /prometheus

        resources:

          requests:
            cpu: "100m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

      volumes:

      - name: prometheus-config

        configMap:

          name: prometheus-config

      - name: prometheus-storage

        emptyDir: {}
---
apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: monitoring

spec:

  type: ClusterIP

  selector:
    app: prometheus

  ports:

  - port: 9090

    targetPort: 9090